apiVersion: apps/v1
kind: Deployment
metadata:
  name: prism-library
  namespace: prism-library
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prism-library
  template:
    metadata:
      labels:
        app: prism-library
    spec:
      containers:
        - name: prism-library
          image: stejose/prism-library:latest
          ports:
            - containerPort: 8792
          env:
            # Loads the sample deals on start. Data is kept in the pod only (lost on restart) until a volume and DATA_DIR are added.
            - name: LIBRARY_SEED
              value: sample
