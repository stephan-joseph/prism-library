apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prism-library-data
  namespace: prism-library
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp2
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prism-library
  namespace: prism-library
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prism-library
  template:
    metadata:
      labels:
        app: prism-library
    spec:
      containers:
        - name: prism-library
          image: stejose/prism-library:latest
          ports:
            - containerPort: 8792
          env:
            # Loads the sample deals the first time the store is empty. Remove them in Curation, then delete this variable.
            - name: LIBRARY_SEED
              value: sample
            - name: DATA_DIR
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # Persistent 5Gi EBS volume - survives pod replacement and redeploys.
        - name: data
          persistentVolumeClaim:
            claimName: prism-library-data
