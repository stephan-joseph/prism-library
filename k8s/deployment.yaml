apiVersion: apps/v1
kind: Deployment
metadata:
  name: prism-library
  namespace: prism-library
spec:
  replicas: 1
  # One replica, and the old pod stops before the new one starts: the data disk has a single writer.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prism-library
  template:
    metadata:
      labels:
        app: prism-library
    spec:
      containers:
        - name: prism-library
          image: stejose/prism-library:latest
          ports:
            - containerPort: 8792
          env:
            # Loads the sample deals the first time the store is empty. Remove them in Curation, then delete this variable.
            - name: LIBRARY_SEED
              value: sample
            - name: DATA_DIR
              value: /data
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: prism-library-data
