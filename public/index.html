<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prism Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="eb">DAMO · Reusable solutions</span><h1>Prism Library</h1></div>
    <div class="btns" style="align-items:center">
      <span class="badge" id="betaBadge" hidden>Private beta</span>
      <span class="badge sample" id="sampleBadge" hidden>Sample data</span>
      <button class="cur" id="curBtn" type="button"></button>
    </div>
  </header>
  <nav class="tabs" role="tablist" aria-label="Views" id="tabs"></nav>
  <main id="view"><div class="load">Loading the library…</div></main>
</div>
<div id="layer"></div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
